# =============================================================================
# Payment Intelligence Agent - docker-compose
# =============================================================================
# Run:           docker compose up --build
# With Redis:    docker compose --profile cache up --build
# Open UI at:    http://localhost:8501
# =============================================================================
version: "3.8"

services:
  payment-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: payment-intelligence-agent:latest
    container_name: payment-agent
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEMO_MODE: ${DEMO_MODE:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./config:/app/config:ro
      - embeddings-cache:/app/embeddings_cache
    networks:
      - payment-net
    depends_on:
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (uncomment to enforce; requires Compose deploy support)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 2G
    #     reservations:
    #       cpus: "0.5"
    #       memory: 512M

  # Optional Redis cache - enable with `--profile cache`
  redis:
    image: redis:7-alpine
    container_name: payment-agent-redis
    restart: unless-stopped
    profiles:
      - cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - payment-net
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: 256M

networks:
  payment-net:
    driver: bridge

volumes:
  embeddings-cache:
    driver: local
  redis-data:
    driver: local
