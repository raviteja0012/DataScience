# PCI-DSS v4.0 Compliance Rules Configuration
# Defines rule mappings, severity levels, and validation criteria
# used by the RAG pipeline and compliance checker.

pci_version: "4.0"

requirements:
  - id: "1"
    title: "Install and Maintain Network Security Controls"
    severity: "high"
    controls:
      - "1.1: Processes and mechanisms for network security controls are defined and understood"
      - "1.2: Network security controls are configured and maintained"
      - "1.3: Network access to and from the cardholder data environment is restricted"
      - "1.4: Network connections between trusted and untrusted networks are controlled"
      - "1.5: Risks to the CDE from computing devices that connect to both untrusted and trusted networks are mitigated"

  - id: "2"
    title: "Apply Secure Configurations to All System Components"
    severity: "high"
    controls:
      - "2.1: Processes and mechanisms for secure configurations are defined and understood"
      - "2.2: System components are configured and managed securely"
      - "2.3: Wireless environments are configured and managed securely"

  - id: "3"
    title: "Protect Stored Account Data"
    severity: "critical"
    controls:
      - "3.1: Processes and mechanisms for protecting stored account data are defined and understood"
      - "3.2: Storage of account data is kept to a minimum"
      - "3.3: Sensitive authentication data (SAD) is not stored after authorization"
      - "3.4: Access to displays of full PAN and ability to copy cardholder data are restricted"
      - "3.5: Primary account number (PAN) is secured wherever it is stored"
      - "3.6: Cryptographic keys used to protect stored account data are secured"
      - "3.7: Where cryptography is used to protect stored account data, key management processes and procedures are defined and implemented"

  - id: "4"
    title: "Protect Cardholder Data with Strong Cryptography During Transmission"
    severity: "critical"
    controls:
      - "4.1: Processes and mechanisms for protecting cardholder data with strong cryptography during transmission are defined and understood"
      - "4.2: PAN is protected with strong cryptography during transmission"

  - id: "5"
    title: "Protect All Systems and Networks from Malicious Software"
    severity: "high"
    controls:
      - "5.1: Processes and mechanisms for protecting systems and networks from malicious software are defined and understood"
      - "5.2: Malicious software is prevented, or detected and addressed"
      - "5.3: Anti-malware mechanisms and processes are active, maintained, and monitored"
      - "5.4: Anti-phishing mechanisms protect users against phishing attacks"

  - id: "6"
    title: "Develop and Maintain Secure Systems and Software"
    severity: "high"
    controls:
      - "6.1: Processes and mechanisms for developing and maintaining secure systems and software are defined and understood"
      - "6.2: Bespoke and custom software is developed securely"
      - "6.3: Security vulnerabilities are identified and addressed"
      - "6.4: Public-facing web applications are protected against attacks"
      - "6.5: Changes to all system components are managed securely"

  - id: "7"
    title: "Restrict Access to System Components and Cardholder Data by Business Need to Know"
    severity: "critical"
    controls:
      - "7.1: Processes and mechanisms for restricting access are defined and understood"
      - "7.2: Access to system components and data is appropriately defined and assigned"
      - "7.3: Access to system components and data is managed via an access control system"

  - id: "8"
    title: "Identify Users and Authenticate Access to System Components"
    severity: "critical"
    controls:
      - "8.1: Processes and mechanisms for identification and authentication are defined and understood"
      - "8.2: User identification and related accounts are strictly managed throughout the account lifecycle"
      - "8.3: Strong authentication for users and administrators is established and managed"
      - "8.4: Multi-factor authentication (MFA) is implemented to secure access into the CDE"
      - "8.5: Multi-factor authentication (MFA) systems are configured to prevent misuse"
      - "8.6: Use of application and system accounts and associated authentication factors is strictly managed"

  - id: "9"
    title: "Restrict Physical Access to Cardholder Data"
    severity: "high"
    controls:
      - "9.1: Processes and mechanisms for restricting physical access are defined and understood"
      - "9.2: Physical access controls manage entry into facilities and systems containing cardholder data"
      - "9.3: Physical access for personnel and visitors is authorized and managed"
      - "9.4: Media with cardholder data is securely stored, accessed, distributed, and destroyed"
      - "9.5: Point-of-interaction (POI) devices are protected from tampering and unauthorized substitution"

  - id: "10"
    title: "Log and Monitor All Access to System Components and Cardholder Data"
    severity: "critical"
    controls:
      - "10.1: Processes and mechanisms for logging and monitoring are defined and understood"
      - "10.2: Audit logs are implemented to support the detection of anomalies and suspicious activity"
      - "10.3: Audit logs are protected from destruction and unauthorized modifications"
      - "10.4: Audit logs are reviewed to identify anomalies or suspicious activity"
      - "10.5: Audit log history is retained and available for analysis"
      - "10.6: Time-synchronization mechanisms support consistent time settings across all systems"
      - "10.7: Failures of critical security control systems are detected, reported, and responded to promptly"

  - id: "11"
    title: "Test Security of Systems and Networks Regularly"
    severity: "high"
    controls:
      - "11.1: Processes and mechanisms for regularly testing security are defined and understood"
      - "11.2: Wireless access points are identified and monitored, and unauthorized wireless access points are addressed"
      - "11.3: External and internal vulnerabilities are regularly identified, prioritized, and addressed"
      - "11.4: External and internal penetration testing is regularly performed and exploitable vulnerabilities are corrected"
      - "11.5: Network intrusions and unexpected file changes are detected and responded to"
      - "11.6: Unauthorized changes on payment pages are detected and responded to"

  - id: "12"
    title: "Support Information Security with Organizational Policies and Programs"
    severity: "high"
    controls:
      - "12.1: A comprehensive information security policy is known and in effect"
      - "12.2: Acceptable use policies for end-user technologies are defined and implemented"
      - "12.3: Risks to the cardholder data environment are formally identified, evaluated, and managed"
      - "12.4: PCI DSS compliance is managed"
      - "12.5: PCI DSS scope is documented and validated"
      - "12.6: Security awareness education is an ongoing activity"
      - "12.7: Personnel are screened to reduce risks from insider threats"
      - "12.8: Risk to information assets from third-party service provider (TPSP) relationships is managed"
      - "12.9: Third-party service providers (TPSPs) support their customers' PCI DSS compliance"
      - "12.10: Suspected and confirmed security incidents that could impact the CDE are responded to immediately"

severity_levels:
  critical:
    response_time_hours: 1
    escalation: "immediate"
    color: "#dc3545"
  high:
    response_time_hours: 24
    escalation: "next_business_day"
    color: "#fd7e14"
  medium:
    response_time_hours: 72
    escalation: "weekly_review"
    color: "#ffc107"
  low:
    response_time_hours: 168
    escalation: "monthly_review"
    color: "#28a745"

validation:
  # How often compliance checks should run
  scan_frequency_days: 90
  # External vulnerability scan requirement
  asv_scan_frequency_days: 90
  # Internal vulnerability scan requirement
  internal_scan_frequency_days: 90
  # Penetration testing frequency
  pentest_frequency_days: 365
