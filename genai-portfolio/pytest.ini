# =============================================================================
# GenAI Portfolio - Root pytest configuration
# Author: Ravi Potluru
#
# Aggregates the test suites of all three projects under a single configuration
# so that `pytest` can be run from the genai-portfolio/ root and exercise the
# full 240-test suite with consistent settings.
# =============================================================================

[pytest]
minversion = 7.0

# Test directories spanning all three projects in the portfolio
testpaths =
    biller-integration-simulator/tests
    payment-intelligence-agent/tests
    multi-source-data-integration/tests

# Default options applied to every run
#   -v               verbose: show one line per test
#   --tb=short       compact traceback style for readable CI logs
#   --strict-markers fail if a test uses an unregistered marker
addopts = -v --tb=short --strict-markers

# Registered markers (declared so --strict-markers doesn't reject them)
markers =
    unit: fast, isolated unit tests with no I/O or network access
    integration: tests that exercise multiple modules or external resources
    slow: long-running tests that should be skipped in tight feedback loops

# Suppress known noisy warnings from upstream libraries
filterwarnings =
    # pandas 4.0 deprecation of datetime.utcnow()
    ignore:.*datetime\.utcnow.*:DeprecationWarning
    ignore:.*utcnow\(\) is deprecated.*:DeprecationWarning
    # Generic Pandas4Warning surface
    ignore::DeprecationWarning:pandas
    # SettingWithCopyWarning false positives from chained indexing in legacy fixtures
    ignore::FutureWarning:pandas
    # sentence-transformers / huggingface noise
    ignore::UserWarning:transformers
    ignore::FutureWarning:huggingface_hub

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
