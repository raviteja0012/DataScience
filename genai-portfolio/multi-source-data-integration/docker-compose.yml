# =============================================================================
# Multi-Source Data Integration - docker-compose
# =============================================================================
# Run:   docker compose up --build
# Logs:  docker compose logs -f data-integration
#
# The `oracle` and `mssql` services below are commented out by default.
# Uncomment them when you want a self-contained end-to-end integration test.
# =============================================================================
version: "3.8"

services:
  data-integration:
    build:
      context: .
      dockerfile: Dockerfile
    image: multi-source-data-integration:latest
    container_name: data-integration
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEMO_MODE: ${DEMO_MODE:-true}
      SOURCE_ORACLE_HOST: ${SOURCE_ORACLE_HOST:-}
      SOURCE_ORACLE_PORT: ${SOURCE_ORACLE_PORT:-1521}
      SOURCE_MSSQL_HOST: ${SOURCE_MSSQL_HOST:-}
      SOURCE_MSSQL_PORT: ${SOURCE_MSSQL_PORT:-1433}
      TARGET_SNOWFLAKE_ACCOUNT: ${TARGET_SNOWFLAKE_ACCOUNT:-}
      TARGET_SNOWFLAKE_USER: ${TARGET_SNOWFLAKE_USER:-}
      TARGET_SNOWFLAKE_PASSWORD: ${TARGET_SNOWFLAKE_PASSWORD:-}
      TARGET_SNOWFLAKE_WAREHOUSE: ${TARGET_SNOWFLAKE_WAREHOUSE:-}
      TARGET_SNOWFLAKE_DATABASE: ${TARGET_SNOWFLAKE_DATABASE:-}
    volumes:
      # Configuration is mounted read-only
      - ./config:/app/config:ro
      # Outputs and reports are persisted to the host for inspection
      - ./output:/app/output
      - integration-reports:/app/reports
    networks:
      - integration-net
    healthcheck:
      test: ["CMD", "python", "-c", "import src.main"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Resource limits (uncomment to enforce; requires Compose deploy support)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 1G
    #     reservations:
    #       cpus: "0.5"
    #       memory: 256M

