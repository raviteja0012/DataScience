name: GenAI Portfolio CI

on:
  push:
    branches: ["main", "master", "feature/**", "feat/**", "fix/**", "dev/**", "claude/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  genai-tests:
    name: "Tests: ${{ matrix.project.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        project:
          - name: biller-integration-simulator
            path: genai-portfolio/biller-integration-simulator
          - name: payment-intelligence-agent
            path: genai-portfolio/payment-intelligence-agent
          - name: multi-source-data-integration
            path: genai-portfolio/multi-source-data-integration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.project.name }}-${{ hashFiles(format('{0}/requirements.txt', matrix.project.path)) }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.project.name }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ${{ matrix.project.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run pytest
        working-directory: ${{ matrix.project.path }}
        run: |
          python -m pytest tests/ -v --tb=short

  lint:
    name: "Lint: GenAI Portfolio"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('genai-portfolio/**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 on genai-portfolio
        run: |
          flake8 genai-portfolio/ \
            --ignore=E501,W503,E203,E266,E402 \
            --max-line-length=120 \
            --statistics \
            --count \
            --show-source
